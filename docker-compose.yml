# ponytail: minimal Docker setup connecting directly to intranet MySQL
services:
  web:
    build: .
    restart: always
    ports:
      - "8089:80"
      - "8888:80"
    environment:
      DB_SERVER: host.docker.internal
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_NAME: project_manager_db
      MCP_SERVER_URL: http://host.docker.internal:3800/api/mcp/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html

  mcp:
    build: ./mcp-server
    restart: always
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: project_manager_db
      MCP_HTTP_PORT: 3800
      LMSTUDIO_BASE_URL: https://lmstudio.endrisusanto.my.id/v1
      LMSTUDIO_MODEL: auto
    volumes:
      - ./mcp-server/index.js:/app/index.js
