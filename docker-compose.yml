services:
  web:
    build: .
    container_name: project_manager_web
    restart: always
    ports:
      - "8089:80"
      - "8888:80"
    environment:
      DB_SERVER: db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_NAME: project_manager_db
      MCP_SERVER_URL: http://host.docker.internal:3800/api/mcp/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: ./mcp-server
    container_name: project_manager_mcp
    restart: always
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3309
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: project_manager_db
      MCP_HTTP_PORT: 3800
      LMSTUDIO_BASE_URL: https://lmstudio.endrisusanto.my.id/v1
      LMSTUDIO_MODEL: auto
    volumes:
      - ./mcp-server/index.js:/app/index.js
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: project_manager_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: project_manager_db
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
