<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ProxyPreserveHost On
	RewriteEngine On

	# WebSocket Upgrade Proxy for Tauri Bridge & Real-time Sync
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/ws/(.*)           ws://host.docker.internal:3800/ws/$1 [P,L]
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/ws                ws://host.docker.internal:3800/ws [P,L]

	# Standard HTTP Proxy for fallback and MCP tools
	ProxyPass /ws/ ws://host.docker.internal:3800/ws/
	ProxyPassReverse /ws/ ws://host.docker.internal:3800/ws/
	ProxyPass /ws ws://host.docker.internal:3800/ws
	ProxyPassReverse /ws ws://host.docker.internal:3800/ws

	ProxyPass /api/mcp/ http://host.docker.internal:3800/api/mcp/
	ProxyPassReverse /api/mcp/ http://host.docker.internal:3800/api/mcp/
	ProxyPass /api/mcp http://host.docker.internal:3800/api/mcp
	ProxyPassReverse /api/mcp http://host.docker.internal:3800/api/mcp

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
