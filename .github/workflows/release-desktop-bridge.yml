name: Release Desktop Bridge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Desktop Bridge
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop-bridge/package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        working-directory: ./desktop-bridge
        run: npm ci

      - name: Build Desktop Bridge with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './desktop-bridge'
          tagName: ${{ github.ref_name }}
          releaseName: 'GBA Bridge Sync ${{ github.ref_name }}'
          releaseBody: 'Pembaruan otomatis software GBA Bridge Sync ${{ github.ref_name }}. Dilengkapi verifikasi digital signature minisign (.sig) & installer NSIS/MSI.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
